# Which model does which job. Every call's cost is still logged, and the overseer reports spending twice a day.
roles:
  extract: {model: claude-haiku-5-5, effort: low,  max_tokens: 16000}   # high volume: turn items into event records
  analyst: {model: claude-fable-5-2, effort: high, max_tokens: 32000}   # one session with tools: reads memory, connects, decides
  scout:   {model: claude-opus-5-5,  effort: high, max_tokens: 16000}   # finds new sources, retires ones that never pay
  dream:   {model: claude-opus-5-5,  effort: high, max_tokens: 32000}   # nightly memory upkeep with tools: folds notes into pages, checks claims
  reflect: {model: claude-fable-5-2, effort: high, max_tokens: 32000}   # weekly: rewrites the lessons page from the scored record
  crawl:    {model: claude-haiku-5-5, effort: low,  max_tokens: 16000}   # cheap: proposes sources and judges candidates that code has tested
  build:    {model: claude-opus-5-5,  effort: medium, max_tokens: 4000}  # writes the recipe that reads a page or data source the crawler found
  overseer: {model: claude-fable-5-2, effort: high, max_tokens: 16000}    # a few times a day: is every part running, and do they fit together
  recheck:  {model: claude-fable-5-2, effort: medium, max_tokens: 8000}  # weekly: re-judges a sample of the extractor's keep-or-drop decisions
  lab:      {model: claude-fable-5-2, effort: high, max_tokens: 16000}   # weekly: proposes trading rules for code to test
# No spending cap in code: the owner limits spend in Anthropic billing. Set a number here to cap a day's spend again,
# and reserved_usd: {analyst: N} to keep part of that for a role.
daily_budget_usd: 0
# USD per million tokens: input, output, cache read
prices:
  claude-haiku-5-5: [0.10, 0.50, 0.01]
  claude-opus-5-5:  [4.00, 20.00, 0.20]
  claude-fable-5-2: [8.00, 40.00, 0.20]
