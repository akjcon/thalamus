# Which model does which job, and the daily spending cap enforced in code.
roles:
  extract: {model: claude-haiku-5-5, effort: low,  max_tokens: 16000}   # high volume: turn items into event records
  fold:    {model: claude-opus-5-5,  effort: medium, max_tokens: 16000} # fold queued notes into a wiki page
  analyst: {model: claude-fable-5-2, effort: high, max_tokens: 32000}   # one session with tools: reads memory, connects, decides
  scout:   {model: claude-opus-5-5,  effort: high, max_tokens: 16000}   # finds new sources, retires ones that never pay
  dream:   {model: claude-fable-5-2, effort: high, max_tokens: 32000}   # offline reflection: what has the record taught us
daily_budget_usd: 15.00
# USD per million tokens: input, output, cache read
prices:
  claude-haiku-5-5: [0.10, 0.50, 0.01]
  claude-opus-5-5:  [4.00, 20.00, 0.20]
  claude-fable-5-2: [8.00, 40.00, 0.20]
