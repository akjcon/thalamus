# Data feeds: measurements, not news. Each has a kind that names its reader in thal/ingest.py (SERIES).
# One item a day states the level and how it has moved; the daily values are kept in the readings table.
data_feeds:
  - name: "Rhine level at Kaub"
    kind: pegelonline
    url: "https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations/KAUB/W/measurements.json?start=P15D"
    why: "the gauge that limits barge loads on the middle Rhine (chemicals, fuel, coal, grain)"
    note: "Kaub is the shallowest point of the middle Rhine. Below roughly 80 cm barges cannot load fully, and below roughly 40 cm many cannot sail."
  - name: "Mississippi level at St. Louis"
    kind: usgs_gauge
    url: "https://waterservices.usgs.gov/nwis/dv/?format=json&sites=07010000&parameterCd=00065&period=P30D"
    why: "the gauge that governs barge drafts for US grain and fertiliser moving to and from the Gulf"
    note: "Flood stage here is 30 ft. Barge draft and tow-size limits on the river below St. Louis typically begin when this gauge falls to around 0 ft."

# WAHIS — WOAH global animal-disease notifications (immediate + follow-up).
# Cloudflare-walled SPA, fetched via headless browser (agent/wahis.py).
# The authoritative global early-warning net for biological supply shocks
# (HPAI, ASF, FMD, screwworm, PPR) — global, not US/Mexico-centric like the feeds.
wahis:
  enabled: true
  report_types: ["IN", "FUR"]   # IN = new immediate notification, FUR = follow-up report
  max_events: 25                # cap headlines per cycle (after event-collapse)
  recency_days: 21              # ignore reports older than this
  page_size: 120                # reports pulled before collapse/recency filtering

# Discord channels
discord_log_channel: "thal-logs"

# Model configuration
models:
  scanner: "claude-haiku-4-5-20251001"  # Fast, cheap headline classification
  analyst: "claude-sonnet-4-6"           # Research, world model update, price checks
  deep_analyst: "claude-opus-4-8"        # Core 2nd/3rd-order reasoning (deep_analysis only)
  validator: "claude-sonnet-4-6"         # Red-team validation of surviving trade ideas
